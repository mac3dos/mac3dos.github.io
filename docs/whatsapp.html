<style>
/* Link da bio: 3 fases curtas de "jogo" (negócio, quantidade, prazo) que montam a mensagem e levam ao WhatsApp. Tela única, sempre escura (sistema MAC3DOS Mundos). */
:root{
  --bg:#0B0A0E; --surface:#15131B; --line:#2A2635;
  --fg:#F2F0F7; --muted:#A49FB2;
  --purple:#8E3BF5; --purple-soft:#B88BFF; --purple-deep:#3A1C61;
  --gold:#E8C26A; --on-gold:#120B1F;
  --f-title:"Oxanium","Rajdhani",system-ui,sans-serif;
  --f-display:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow-x:hidden}
a{color:inherit}

.arena{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.arena::before{content:"";position:absolute;left:50%;top:-25%;width:120vmax;height:70vmax;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(142,59,245,.30),rgba(142,59,245,0) 70%)}
.floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:45%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(184,139,255,.26) 1px,transparent 1px),linear-gradient(90deg,rgba(184,139,255,.26) 1px,transparent 1px);
  background-size:56px 56px;animation:run 2.4s linear infinite;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
@keyframes run{to{background-position:0 56px}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}

.page{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  display:grid;gap:28px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:22px;height:33px}
.wordmark{font-family:var(--f-display);font-weight:500;font-size:1.35rem;letter-spacing:.14em}
.wordmark b{font-weight:700;color:#fff;border-bottom:2px solid var(--purple)}
.hud{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hud b{color:var(--purple-soft);font-weight:500}

.intro{display:grid;gap:10px;text-align:center;justify-items:center}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--purple-soft);margin:0}
h1{font-family:var(--f-title);font-weight:800;font-size:clamp(2rem,9vw,2.7rem);line-height:.92;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 span{color:var(--purple-soft)}
.lead{margin:0;color:var(--muted);max-width:34ch}

/* tela de jogo: cena do mundo em cima, trilha do personagem embaixo */
.tela{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#000;display:grid;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cena{position:relative;aspect-ratio:16/7;max-width:100%;overflow:hidden}
.cena canvas,.trilha canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.cena canvas{transition:opacity .35s;height:130%;bottom:auto} /* mostra o céu e os objetos, corta o chão vazio de baixo */
.cena canvas.off{opacity:0}
.cena .tag{position:absolute;top:10px;left:10px;z-index:1;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(11,10,14,.82);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:3px 7px}
.cena .fase{position:absolute;top:10px;right:10px;z-index:1;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:var(--on-gold);border-radius:4px;padding:3px 7px}
.trilha{position:relative;aspect-ratio:160/34;max-width:100%;border-top:1px solid var(--line)}

.stage{display:grid;gap:14px}
.q{font-family:var(--f-title);font-weight:700;font-size:1.35rem;line-height:1.2;margin:0;text-align:center;text-wrap:balance}
.press{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0}
.press::before{content:"▶ ";color:var(--gold);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

.opts{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.opt{width:100%;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
  background:linear-gradient(to bottom,rgba(58,28,97,.45),var(--surface));color:var(--fg);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.opt:hover,.opt:focus-visible{border-color:var(--purple-soft);transform:translateY(-2px);box-shadow:0 0 0 3px rgba(142,59,245,.22),0 14px 34px rgba(0,0,0,.5)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt .tag{flex:none;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--purple-soft);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:62px;text-align:center}
.opt .txt{display:grid;gap:2px;min-width:0}
.opt .name{font-family:var(--f-title);font-weight:800;font-size:1.02rem;letter-spacing:.02em;text-transform:uppercase}
.opt .desc{font-size:.88rem;color:var(--muted);line-height:1.35}
.opt .go{margin-left:auto;flex:none;font-family:var(--f-mono);color:var(--purple-soft)}

.back{justify-self:center;background:none;border:0;color:var(--muted);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:8px}
.back:hover,.back:focus-visible{color:var(--fg)}
.back:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* tela final */
.card{background:linear-gradient(to bottom,rgba(58,28,97,.55),var(--surface));border:1px solid var(--purple-soft);border-radius:18px;padding:18px;display:grid;gap:14px;box-shadow:0 0 0 4px rgba(142,59,245,.22),0 30px 70px rgba(0,0,0,.55),0 0 70px rgba(142,59,245,.3)}
.selo{justify-self:start;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:var(--on-gold);border-radius:4px;padding:3px 8px;font-weight:500}
.resumo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.resumo li{display:flex;gap:10px;font-size:.95rem}
.resumo li::before{content:"◆";color:var(--purple-soft);flex:none}
.resumo b{font-weight:500}
.msg{margin:0;font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.msg q{color:var(--fg)}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--purple);color:var(--fg);
  font-family:var(--f-title);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;border-radius:12px;padding:16px 18px;
  box-shadow:0 10px 30px rgba(142,59,245,.45);transition:transform .15s ease,box-shadow .15s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(142,59,245,.6)}
.cta:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cta svg{width:22px;height:22px;flex:none}
.ghost{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-family:var(--f-title);font-weight:700;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-soft)}
.ghost:hover,.ghost:focus-visible{border-color:var(--purple-soft);background:var(--purple-soft);color:var(--on-gold)}
.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.atalho{border:1px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;text-align:center}
.atalho p{margin:0;font-size:.9rem;color:var(--muted)}
.atalho .btn-direto{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
  border:1.5px solid var(--purple-soft);border-radius:12px;padding:13px 16px;margin-top:4px;
  font-family:var(--f-title);font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-soft);
  background:rgba(142,59,245,.12);transition:background .15s ease,color .15s ease,transform .15s ease}
.atalho .btn-direto svg{width:20px;height:20px;flex:none}
.atalho .btn-direto:hover,.atalho .btn-direto:focus-visible{background:var(--purple-soft);color:var(--on-gold);transform:translateY(-2px)}
.atalho .btn-direto:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;color:var(--muted);user-select:all}

.slogan{text-align:center;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}

.anim{animation:entra .28s ease both}
@keyframes entra{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.floor,.press::before,.anim{animation:none}.opt,.cta{transition:none}}
</style>

<script>
function pixelScene(cv, kind){
  const ctx = cv.getContext("2d");
  const col = h => { const n = parseInt(h.slice(1), 16); return (255 << 24) | ((n & 255) << 16) | (n & 0xff00) | (n >> 16); };
  const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => v / 16);
  const dith = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
  const C = {
    sky: ["#0d0818","#170d2b","#251448","#3a1c61"].map(col),
    sun: ({academia:["#d6fff7","#7fe9dc","#35b6c9","#1f6f9e"], estetica:["#f3ecff","#cdb6ff","#9d7cf0","#5f45c4"], criadores:["#fff1d6","#ffc46b","#f2784b","#b23a6a"], celulares:["#eaffd6","#a8f07f","#4fc46b","#1f7a55"], inicio:["#fff6d6","#f3d88f","#e8c26a","#8e3bf5"]}[kind]).map(col),
    floor: col("#110a1d"), gridFar: col("#3b1f70"), gridNear: col("#7a46d6"), horizon: col("#b88bff"),
    star: col("#ffffff"), star2: col("#b88bff"), shadow: col("#07040d"), out: col("#07040d")
  };
  let W = 160, H = 110, img, buf;
  function size(){
    const r = cv.getBoundingClientRect();
    const h = r.width ? Math.max(60, Math.min(170, Math.round(160 * r.height / r.width))) : 110;
    if (img && h === H) return;
    W = 160; H = h; cv.width = W; cv.height = H;
    img = ctx.createImageData(W, H); buf = new Uint32Array(img.data.buffer);
  }
  const put = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; };
  function line(x0, y0, x1, y1, c){
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
    for (;;) { put(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  }
  // desenha uma forma a partir de uma função que diz se o pixel está dentro, com contorno de 1 pixel
  function shape(x0, y0, x1, y1, inside, paint){
    for (let y = y0 - 1; y <= y1 + 1; y++) for (let x = x0 - 1; x <= x1 + 1; x++) {
      if (inside(x, y)) paint(x, y);
      else if (inside(x + 1, y) || inside(x - 1, y) || inside(x, y + 1) || inside(x, y - 1)) put(x, y, C.out);
    }
  }
  // bola com luz vinda de cima à esquerda
  function ball(cx, cy, r, pal){
    const inside = (x, y) => { const dx = x - cx + .5, dy = y - cy + .5; return dx * dx + dy * dy <= r * r; };
    shape(cx - r, cy - r, cx + r, cy + r, inside, (x, y) => {
      const nx = (x - cx + .5) / r, ny = (y - cy + .5) / r, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      const v = -.45 * nx - .6 * ny + .65 * nz + (dith(x, y) - .5) * .2;
      put(x, y, v > .98 ? pal[4] : v > .72 ? pal[3] : v > .42 ? pal[2] : v > .14 ? pal[1] : pal[0]);
    });
  }
  function box(x0, y0, x1, y1, pal){
    shape(x0, y0, x1, y1, (x, y) => x >= x0 && x <= x1 && y >= y0 && y <= y1, (x, y) => {
      const u = (x - x0) / Math.max(1, x1 - x0);
      put(x, y, u < .2 ? pal[2] : u > .78 ? pal[0] : pal[1]);
    });
  }
  // logo da MAC3DOS (os três triângulos) em pixels, centrada em cx, a partir do topo y0, com contorno
  const LOGO = [[[0,2],[27,31],[0,58],"#D6D5DC"],[[56,0],[56,58],[6,58],"#8E3BF5"],[[0,58],[56,58],[28,84],"#3A1C61"]].map(([p, q, r, c]) => [p, q, r, col(c)]);
  const tri = (x, y, [p, q, r]) => { const d = (a, b, c) => (a[0] - c[0]) * (b[1] - c[1]) - (b[0] - c[0]) * (a[1] - c[1]); const s1 = d([x, y], p, q), s2 = d([x, y], q, r), s3 = d([x, y], r, p); return !((s1 < 0 || s2 < 0 || s3 < 0) && (s1 > 0 || s2 > 0 || s3 > 0)); };
  function logo(cx, y0, lw, outline){
    const lh = Math.round(lw * 84 / 56), lx = cx - Math.floor(lw / 2);
    const hit = (i, j) => { const ux = (i + .5) / lw * 56, uy = (j + .5) / lh * 84; for (const L of LOGO) if (tri(ux, uy, L)) return L[3]; return 0; };
    for (let j = -1; j <= lh; j++) for (let i = -1; i <= lw; i++) {
      const c = hit(i, j);
      if (c) put(lx + i, y0 + j, c);
      else if (hit(i + 1, j) || hit(i - 1, j) || hit(i, j + 1) || hit(i, j - 1)) put(lx + i, y0 + j, outline);
    }
  }
  function shadow(cx, cy, rw, rh){
    for (let y = -rh; y <= rh; y++) for (let x = -rw; x <= rw; x++) if ((x * x) / (rw * rw) + (y * y) / (rh * rh) <= 1 && dith(x + cx, y + cy) < .75) put(cx + x, cy + y, C.shadow);
  }
  const stars = []; let seed = {academia:7, estetica:19, criadores:31, celulares:43, inicio:53}[kind];
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 34; i++) stars.push([rnd(), rnd(), rnd() * 6.28]);

  function backdrop(t, hz){
    for (let y = 0; y < hz; y++) {
      const fpos = y / hz * (C.sky.length - 1), i = Math.min(C.sky.length - 2, fpos | 0), fr = fpos - i;
      for (let x = 0; x < W; x++) buf[y * W + x] = fr > dith(x, y) ? C.sky[i + 1] : C.sky[i];
    }
    stars.forEach(([sx, sy, ph]) => { const x = sx * W | 0, y = sy * hz * .75 | 0; if (Math.sin(t * 2.2 + ph) > -.35) put(x, y, ph > 3 ? C.star : C.star2); });
    // sol retrô com faixas que descem
    const cx = W / 2, cy = hz - 1, r = Math.round(U * .27);
    for (let y = cy - r; y < hz; y++) for (let x = cx - r; x <= cx + r; x++) {
      const dx = x - cx + .5, dy = y - cy + .5; if (dx * dx + dy * dy > r * r) continue;
      const rel = (y - (cy - r * .45)); if (rel > 0 && ((y + (t * 5 | 0)) % 6) < 1 + rel / (r * .2)) continue;
      const fpos = (y - (cy - r)) / r * (C.sun.length - 1), i = Math.min(C.sun.length - 2, Math.max(0, fpos | 0)), fr = fpos - i;
      put(x, y, fr > dith(x, y) ? C.sun[i + 1] : C.sun[i]);
    }
    for (let y = hz; y < H; y++) for (let x = 0; x < W; x++) buf[y * W + x] = C.floor;

    const x0 = mx - Math.round(pw / 2), x1 = x0 + pw, y1 = fy - 3 + bob, y0 = y1 - phh, rr = Math.max(2, Math.round(pw * .16));
    shadow(mx, fy + 1, Math.round(pw / 2) + 3, 3 - (bob > 0 ? 1 : 0));
    const inPhone = (x, y) => { if (x < x0 || x > x1 || y < y0 || y > y1) return false; const ax = x < x0 + rr ? x0 + rr - x : x > x1 - rr ? x - (x1 - rr) : 0, ay = y < y0 + rr ? y0 + rr - y : y > y1 - rr ? y - (y1 - rr) : 0; return ax * ax + ay * ay <= rr * rr; };
    shape(x0, y0, x1, y1, inPhone, (x, y) => { const u = (x - x0) / pw; put(x, y, u < .16 ? PH[3] : u > .84 ? PH[0] : (u < .3 && dith(x, y) > .5) ? PH[3] : PH[2]); });
    const cm = Math.round(pw * .46), cx0 = x0 + 3, cy0 = y0 + 3;
    shape(cx0, cy0, cx0 + cm, cy0 + cm, (x, y) => x >= cx0 && x <= cx0 + cm && y >= cy0 && y <= cy0 + cm, (x, y) => put(x, y, x === cx0 || y === cy0 ? DARKC[2] : DARKC[1]));
    const lr = Math.max(1, Math.round(cm * .2));
    [[.3, .3], [.3, .72], [.72, .5]].forEach(([fx, fy2]) => {
      const lcx = cx0 + Math.round(cm * fx), lcy = cy0 + Math.round(cm * fy2);
      for (let y = -lr; y <= lr; y++) for (let x = -lr; x <= lr; x++) if (x * x + y * y <= lr * lr + .5) put(lcx + x, lcy + y, (x === -lr + 1 && y === -lr + 1) || (lr === 1 && x === -1 && y === -1) ? SILV[2] : DARKC[0]);
    });
    put(x1 - 3, y0 + 3, DARKC[0]); put(x1 - 4, y0 + 3, DARKC[0]); put(x1 - 3, y0 + 4, DARKC[0]); put(x1 - 4, y0 + 4, DARKC[0]);
    const lw2 = Math.max(4, Math.round(pw * .3));
    logo(mx, y0 + Math.round((phh - lw2 * 84 / 56) / 2), lw2, PH[0]);
    const ringX = x1 - 3, ringY = y0 - 4, ringR = Math.max(2, Math.round(U * .028));
    for (let a = 0; a < 6.28; a += .25) put(ringX + Math.round(Math.cos(a) * ringR), ringY + Math.round(Math.sin(a) * ringR), Math.sin(a) < 0 ? GOLD[3] : GOLD[1]);
    if (Math.sin(t * 3) > .2) { const sx = x0 + 2, sy = y0 + Math.round(phh * .75); put(sx, sy, WHITE); put(sx, sy - 1, PH[3]); put(sx, sy + 1, PH[3]); }

    // raios de carga subindo
    const BOLT = ["..X","..X",".X.","XXX",".X.","X.."];
    [[.36, 0], [.64, 18], [.95, 33], [.05, 9]].forEach(([fxx, phs], i) => {
      const yy = fy - 6 - ((t * 9 + phs) % (fy - 8)), xx = Math.round(W * fxx) + Math.round(Math.sin(t * 2 + i) * 2);
      BOLT.forEach((row, j) => [...row].forEach((ch, k) => { if (ch === "X") put(xx + k, yy + j, i % 2 ? col("#f2d43d") : col("#a8f07f")); }));
    });
  }

  function inicio(t, hz, fy){
    const bob = Math.round(Math.sin(t * 2.4) * 2);
    const lw = Math.max(10, Math.round(U * .26)), lh = Math.round(lw * 84 / 56);
    shadow(Math.round(W / 2), fy + 1, Math.round(lw * .7), 3 - (bob > 0 ? 1 : 0));
    logo(Math.round(W / 2), fy - lh - 4 + bob, lw, C.out);
    // brilhos girando em volta da logo
    for (let i = 0; i < 5; i++) {
      const ang = t * 1.6 + i * 1.256, sx = Math.round(W / 2 + Math.cos(ang) * lw * 1.5), sy = Math.round(fy - lh / 2 - 4 + Math.sin(ang) * lh * .45 + bob);
      if (Math.sin(t * 4 + i) < -.3) continue;
      const c = i % 2 ? col("#e8c26a") : col("#ffffff");
      put(sx, sy, c); put(sx - 1, sy, c); put(sx + 1, sy, c); put(sx, sy - 1, c); put(sx, sy + 1, c);
    }
    // blocos de "?" nos cantos, como num jogo de plataforma
    [[.17, 0], [.83, 1.7]].forEach(([fx, ph]) => {
      const s = Math.round(U * .11), x0 = Math.round(W * fx) - s, y0 = fy - s * 2 - 6 + Math.round(Math.sin(t * 2 + ph) * 1.5);
      box(x0, y0, x0 + s * 2, y0 + s * 2, GOLD);
      const Q = [".XX.","X..X","..X.",".X..","....",".X.."];
      Q.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === "X") put(x0 + s - 1 + i, y0 + s - 3 + j, col("#6e4a14")); }));
    });
  }

  let U = 110;
  function draw(t){
    size(); U = Math.min(H, Math.round(W * .8));
    const sq = H > W * .9, hz = Math.round(H * (sq ? .47 : .56)), fy = hz + Math.round((H - hz) * (sq ? .24 : .36));
    backdrop(t, hz);
    ({academia, estetica, criadores, celulares, inicio})[kind](t, hz, fy);
    ctx.putImageData(img, 0, 0);
  }

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let visible = true, last = 0;
  if ("IntersectionObserver" in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(cv);
  if (still) { draw(1.2); addEventListener("resize", () => draw(1.2)); return; }
  (function loop(ms){
    requestAnimationFrame(loop);
    if (!visible || ms - last < 66) return; // ~15 quadros por segundo, ritmo de videogame antigo
    last = ms; draw(ms / 1000);
  })(0);
}
// trilha(canvas, função que diz a fase atual, 'gato' ou 'boneco')
function trilha(cv, getAlvo, quem){
  // desenha numa área de 160x50 mas mostra só a faixa de 14 a 48 (corta o céu vazio)
  var W = 160, H = 50, TOPO = 14; cv.width = W; cv.height = H - TOPO - 2;
  var ctx = cv.getContext('2d');
  var pos = 0, t0 = 0;
  var NODES = [18, 58, 98, 140];
  var HERO = [
    "..PPPPP..",
    ".PPPPPPP.",
    ".KSSSSSK.",
    ".SSWSWSS.",
    ".SSSSSSS.",
    "..SSSSS..",
    ".GGGGGGG.",
    "SGGGLGGGS",
    "SGGGGGGGS",
    ".GGGGGGG.",
    "..BB.BB..",
    "..BB.BB.."
  ];
  var HERO2 = HERO.slice(0, 10).concat(["..BB..BB.", ".BB....BB"]);
  var PAL = {P:'#8e3bf5', K:'#3a1c61', S:'#f3c9a0', W:'#120b1f', G:'#b88bff', L:'#e8c26a', B:'#2a2635'};
  // gatinho nas cores da logo: orelhas em triângulo roxo, cabeça prateada, corpo roxo, peito prateado
  var GATO = [
    "T.......P...P.",
    "T.......PK.KP.",
    ".T.....SSSSSSS",
    ".T.....SEWSEWS",
    "..T....SSSNSSS",
    "..GGGGGSSSSSS.",
    ".GGGGGGGGLLGG.",
    ".GGGGGGGGGLGG.",
    ".GGGGGGGGGGGG.",
    "..D.D....D.D..",
    "..D.D....D.D.."
  ];
  var GATO2 = GATO.slice(0, 9).concat([".D...D..D...D.", "D.....DD.....D"]);
  var PAL_GATO = {T:'#8e3bf5', P:'#8e3bf5', K:'#3a1c61', S:'#d6d5dc', E:'#e8c26a', W:'#120b1f', N:'#f07cb0', G:'#8e3bf5', L:'#d6d5dc', D:'#d6d5dc'};
  if(quem === 'gato'){ HERO = GATO; HERO2 = GATO2; PAL = PAL_GATO; }
  function px(x, y, c){ ctx.fillStyle = c; ctx.fillRect(x|0, y|0, 1, 1); }
  function sprite(rows, x0, y0){
    var on = function(i, j){ return j >= 0 && j < rows.length && i >= 0 && i < rows[j].length && !!PAL[rows[j][i]]; };
    // contorno de 1 pixel, como nas cenas
    for(var j=-1;j<=rows.length;j++) for(var i=-1;i<=rows[0].length;i++) if(!on(i,j) && (on(i+1,j)||on(i-1,j)||on(i,j+1)||on(i,j-1))) px(x0+i, y0+j, '#07040d');
    rows.forEach(function(r, j){ for(var i=0;i<r.length;i++){ var ch = r[i]; if(PAL[ch]) px(x0+i, y0+j, PAL[ch]); } });
  }
  function draw(ms){
    var t = ms / 1000, alvo = Math.min(3, getAlvo());
    ctx.setTransform(1, 0, 0, 1, 0, -TOPO);
    var dest = NODES[alvo]; var cur = NODES[0] + pos;
    var andando = Math.abs(dest - cur) > .5;
    if(andando) pos += Math.sign(dest - cur) * Math.min(1.2, Math.abs(dest - cur));
    cur = NODES[0] + pos;
    // céu e chão
    var g = ['#0d0818','#170d2b','#251448','#3a1c61'];
    for(var y=0;y<32;y++){ ctx.fillStyle = g[Math.min(3, (y/8)|0)]; ctx.fillRect(0,y,W,1); }
    ctx.fillStyle = '#110a1d'; ctx.fillRect(0,32,W,H-32);
    ctx.fillStyle = '#b88bff'; ctx.fillRect(0,32,W,1);
    for(var s=0;s<14;s++){ var sx = (s*37+11)%W, sy = (s*13+3)%26; if(Math.sin(t*2+s) > -.3) px(sx, sy, s%3 ? '#b88bff' : '#ffffff'); }
    // caminho tracejado
    for(var x=NODES[0]; x<NODES[3]; x+=3){ px(x, 41, x <= cur ? '#8e3bf5' : '#3b1f70'); px(x+1, 41, x <= cur ? '#8e3bf5' : '#3b1f70'); }
    // casas
    NODES.forEach(function(nx, i){
      var feito = i <= alvo;
      if(i < 3){
        ctx.fillStyle = '#07040d'; ctx.fillRect(nx-5, 37, 11, 9);
        ctx.fillStyle = feito ? '#e8c26a' : '#2a2635'; ctx.fillRect(nx-4, 38, 9, 7);
        ctx.fillStyle = feito ? '#fff6d6' : '#3b3646'; ctx.fillRect(nx-4, 38, 9, 1);
        // número da fase
        var D = {0:["X","X","X"],1:["XX",".X","XX","X.","XX"],2:["XX",".X","XX",".X","XX"]}[i];
        if(i === 0){ for(var k=0;k<5;k++) px(nx, 39+k, feito ? '#120b1f' : '#8d86a3'); }
        else D.forEach(function(r, j){ for(var q=0;q<r.length;q++) if(r[q]==='X') px(nx-1+q, 39+j, feito ? '#120b1f' : '#8d86a3'); });
      } else {
        // bandeira verde do WhatsApp
        ctx.fillStyle = '#8d86a3'; ctx.fillRect(nx, 18, 1, 26);
        var wave = Math.round(Math.sin(t*5)*1);
        ctx.fillStyle = '#07040d'; ctx.fillRect(nx+1, 17+wave, 15, 11);
        ctx.fillStyle = alvo >= 3 ? '#25d366' : '#1f7a55'; ctx.fillRect(nx+1, 18+wave, 14, 9);
        ctx.fillStyle = '#ffffff';
        [[5,2],[6,2],[7,2],[8,2],[4,3],[9,3],[4,4],[9,4],[4,5],[9,5],[5,6],[6,6],[7,6],[8,6],[4,7]].forEach(function(p){ px(nx+1+p[0]+1, 18+wave+p[1]-1, '#ffffff'); });
        ctx.fillStyle = '#07040d'; ctx.fillRect(nx-3, 44, 7, 2);
      }
    });
    // personagem
    var bob = andando ? (Math.floor(t*10)%2) : Math.round(Math.sin(t*3)*.6);
    var frame = andando && Math.floor(t*10)%2 ? HERO2 : HERO;
    ctx.fillStyle = 'rgba(7,4,13,.8)'; ctx.fillRect(cur-4, 45, 9, 1);
    sprite(frame, Math.round(cur) - (frame[0].length >> 1), 45 - frame.length - bob);
    // festa no fim
    if(alvo >= 3 && !andando){ for(var f=0; f<6; f++){ var a = t*3 + f; px(NODES[3] + 8 + Math.cos(a)*10, 22 + Math.sin(a)*4, f%2 ? '#e8c26a' : '#b88bff'); } }
  }
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches, last = 0;
  (function loop(ms){ requestAnimationFrame(loop); if(ms - last < 66) return; last = ms; if(still){ pos = NODES[Math.min(3,getAlvo())] - NODES[0]; } draw(ms); })(0);
}
</script>
<script>
(function(){
  var FONE = '5521985101880';

  var FASES = [
    {id:'negocio', q:'Qual é o seu negócio?', press:'Toque para escolher', opts:[
      {tag:'Mundo 1', name:'Esportes e bem-estar', desc:'Academia, estúdio, personal, corrida', msg:'esportes e bem-estar', scene:'academia'},
      {tag:'Mundo 2', name:'Estética e beleza', desc:'Salão, clínica, manicure, lash, sobrancelha', msg:'estética e beleza', scene:'estetica'},
      {tag:'Mundo 3', name:'Criador de conteúdo', desc:'Microfones, claquetes e acessórios para o seu set', msg:'criação de conteúdo', scene:'criadores'},
      {tag:'Mundo 4', name:'Celulares e tecnologia', desc:'Loja de celular, assistência técnica', msg:'celulares e tecnologia', scene:'celulares'},
      {tag:'Evento', name:'Eventos e comemorações', desc:'Aniversário, casamento, festa, inauguração', frase:'Quero brindes 3D personalizados para um evento ou comemoração (aniversário, festa, inauguração)', scene:'inicio'},
      {tag:'Outro', name:'Outro segmento', desc:'Conta pra gente no WhatsApp', msg:'outro segmento', scene:'inicio'}
    ]},
    {id:'qtd', q:'Quantas unidades, mais ou menos?', press:'Pode ser um chute', opts:[
      {tag:'Fase 2', name:'Até 30', desc:'Para testar ou um grupo pequeno', msg:'até 30 unidades'},
      {tag:'Fase 2', name:'30 a 100', desc:'Para os clientes do mês', msg:'de 30 a 100 unidades'},
      {tag:'Fase 2', name:'Mais de 100', desc:'Evento, inauguração ou campanha', msg:'mais de 100 unidades'},
      {tag:'Fase 2', name:'Ainda não sei', desc:'Quero ajuda para decidir', msg:'quantidade ainda a definir'}
    ]},
    {id:'prazo', q:'Para quando você precisa?', press:'Última fase', opts:[
      {tag:'Fase 3', name:'Urgente', desc:'Nas próximas 2 semanas', msg:'é urgente, para as próximas 2 semanas'},
      {tag:'Fase 3', name:'Este mês', desc:'Dá tempo de caprichar', msg:'para este mês'},
      {tag:'Fase 3', name:'Sem pressa', desc:'Estou pesquisando', msg:'sem pressa, estou pesquisando'}
    ]}
  ];

  var escolhas = {};
  var atual = 0;
  var stage = document.getElementById('stage');
  var faseTxt = document.getElementById('fase-txt');

  function wa(texto){ return 'https://wa.me/' + FONE + '?text=' + encodeURIComponent(texto); }
  document.getElementById('direto').href = wa('Olá, MAC3DOS! Vim pelo Instagram e quero saber mais sobre os brindes 3D.');

  function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }

  // cena do mundo + personagem na trilha
  var cenas = document.querySelectorAll('#cena canvas');
  var mundoTag = document.getElementById('mundo-tag');
  var NOMES = {inicio:'Mundo ?', academia:'Mundo 1', estetica:'Mundo 2', criadores:'Mundo 3', celulares:'Mundo 4'};
  requestAnimationFrame(function(){ for(var i=0;i<cenas.length;i++) pixelScene(cenas[i], cenas[i].dataset.scene); });
  trilha(document.getElementById('trilha'), function(){ return atual; }, 'gato');

  function barra(){
    faseTxt.textContent = atual < FASES.length ? 'Fase ' + (atual+1) + '/3' : 'Pronto';
    var k = atual > 0 && escolhas.negocio ? escolhas.negocio.scene : 'inicio';
    for(var i=0;i<cenas.length;i++) cenas[i].classList.toggle('off', cenas[i].dataset.scene !== k);
    mundoTag.textContent = atual > 0 && escolhas.negocio ? (k === 'inicio' ? (escolhas.negocio.tag === 'Evento' ? 'Evento' : 'Seu mundo') : NOMES[k]) : 'Mundo ?';
  }

  function render(){
    barra();
    stage.innerHTML = '';
    stage.classList.remove('anim'); void stage.offsetWidth; stage.classList.add('anim');
    if(atual >= FASES.length){ return final(); }
    var f = FASES[atual];
    stage.appendChild(el('h2','q',f.q));
    stage.appendChild(el('p','press',f.press));
    var ul = el('ul','opts');
    f.opts.forEach(function(o, i){
      var li = el('li');
      var b = el('button','opt'); b.type = 'button'; b.id = f.id + '-' + i;
      b.appendChild(el('span','tag',o.tag));
      var t = el('span','txt'); t.appendChild(el('span','name',o.name)); t.appendChild(el('span','desc',o.desc));
      b.appendChild(t);
      b.appendChild(el('span','go','▶'));
      b.addEventListener('click', function(){ escolhas[f.id] = o; atual++; render(); });
      li.appendChild(b); ul.appendChild(li);
    });
    stage.appendChild(ul);
    if(atual > 0){
      var v = el('button','back','◀ Voltar'); v.type = 'button';
      v.addEventListener('click', function(){ atual--; render(); });
      stage.appendChild(v);
    }
  }

  function final(){
    var n = escolhas.negocio, q = escolhas.qtd, p = escolhas.prazo;
    var texto = n.frase
      ? 'Olá, MAC3DOS! Vim pelo Instagram. ' + n.frase + ', ' + q.msg + ', ' + p.msg + '.'
      : 'Olá, MAC3DOS! Vim pelo Instagram. Meu negócio é de ' + n.msg + ', quero ' + q.msg + ' de brindes 3D com a minha logo, ' + p.msg + '.';

    var card = el('div','card');
    card.appendChild(el('span','selo','Pedido montado'));
    var ul = el('ul','resumo');
    [['Negócio', n.name], ['Quantidade', q.name], ['Prazo', p.name]].forEach(function(r){
      var li = el('li'); var s = el('span'); s.appendChild(el('b',null,r[0] + ': ')); s.appendChild(document.createTextNode(r[1])); li.appendChild(s); ul.appendChild(li);
    });
    card.appendChild(ul);

    var a = el('a','cta'); a.href = wa(texto); a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.6-.3Z"/></svg>';
    a.appendChild(document.createTextNode('Falar no WhatsApp'));
    card.appendChild(a);

    var m = el('p','msg'); m.appendChild(document.createTextNode('Mensagem que vai pronta: ')); m.appendChild(el('q',null,texto));
    card.appendChild(m);
    stage.appendChild(card);

    var v = el('button','back','◀ Refazer'); v.type = 'button';
    v.addEventListener('click', function(){ escolhas = {}; atual = 0; render(); });
    stage.appendChild(v);
  }

  render();
})();
</script>
